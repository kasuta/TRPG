<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シノビガミ 判定ツール</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Shippori+Mincho:wght@700&display=swap");

    /* 配色はキャラシ(sinobigami/stylesheet.css の light テーマ)に合わせる */
    :root {
      color-scheme: light;
      --ink: #211815;
      --muted: #6b5d52;
      --bg-top: #f4ede0;
      --bg-bottom: #e8ddc9;
      --panel: #fffaf2;
      --surface: #fffdf8;
      --surface-alt: #f6f1e6;
      --border: #d8c9ae;
      --accent: #8c4433;
      --accent-strong: #5c2c22;
      --shadow: rgba(33, 24, 21, 0.12);
      --gap-on: rgba(140, 68, 51, 0.35);
      --lost-hatch: rgba(33, 24, 21, 0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Zen Kaku Gothic New', 'Yu Gothic UI', 'Meiryo', sans-serif;
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
      color: var(--ink);
      min-height: 100vh;
      padding: 20px 16px 40px;
      line-height: 1.5;
    }
    .page { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    h1 {
      font-family: 'Shippori Mincho', serif;
      font-size: 1.6rem;
      color: var(--accent-strong);
      letter-spacing: 0.08em;
    }
    header a { color: var(--muted); font-size: 0.85rem; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 2px 10px var(--shadow);
      padding: 14px 16px;
    }
    .card h2 {
      font-size: 0.95rem;
      padding-left: 8px;
      border-left: 4px solid var(--accent);
      margin-bottom: 10px;
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 5px 12px;
      font-size: 0.85rem;
    }
    button:hover:not(:disabled) { background: var(--accent-strong); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.btn-outline { background: var(--surface); color: var(--accent); }
    button.btn-outline:hover:not(:disabled) { background: var(--surface-alt); }
    input[type="text"], select {
      font: inherit;
      font-size: 0.9rem;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      min-width: 0;
    }

    /* ── キャラクターの読み込み ── */
    .load-sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .load-source { display: flex; flex-direction: column; gap: 6px; }
    .load-source-label { font-size: 0.78rem; color: var(--muted); font-weight: 700; }
    .load-source-row { display: flex; gap: 6px; }
    .load-source-row > input, .load-source-row > select { flex: 1; }
    .load-note { font-size: 0.78rem; color: var(--muted); }
    .load-message { margin-top: 8px; font-size: 0.85rem; min-height: 1.3em; }
    .load-message.is-error { color: #b3261e; }

    /* ── 読み込んだキャラクター ── */
    .char-summary { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; }
    .char-summary-name { font-family: 'Shippori Mincho', serif; font-size: 1.3rem; font-weight: 700; }
    .char-summary-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.8rem; }
    .char-summary-meta span { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; }
    .char-summary-empty { color: var(--muted); font-size: 0.9rem; }

    /* ── モードのタブ ── */
    .mode-tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--accent); }
    .mode-tab {
      background: var(--surface-alt);
      color: var(--muted);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 8px 18px;
      font-weight: 700;
    }
    .mode-tab:hover:not(:disabled) { background: var(--surface); }
    .mode-tab.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .mode-panel[hidden] { display: none; }

    /* ── 特技表 ── */
    .skill-table-wrap { overflow-x: auto; }
    .skill-table { border-collapse: collapse; width: 100%; min-width: 620px; table-layout: fixed; font-size: 0.8rem; }
    .skill-table th, .skill-table td { border: 1px solid var(--border); text-align: center; }
    .skill-table .num-col { width: 30px; background: var(--surface-alt); color: var(--muted); font-weight: 700; }
    .skill-table .gap-col { width: 12px; background: var(--surface); border-top: none; border-bottom: none; }
    .skill-table .gap-col.gap-on { background: var(--gap-on); }
    .area-head { background: var(--accent-strong); color: #fff; padding: 4px 2px; vertical-align: top; }
    .area-head-name { display: block; font-weight: 700; }
    .lost-toggle {
      margin-top: 3px;
      font-size: 0.68rem;
      padding: 1px 6px;
      border-color: rgba(255, 255, 255, 0.6);
      background: transparent;
    }
    .lost-toggle:hover:not(:disabled) { background: rgba(255, 255, 255, 0.15); }
    .lost-toggle[aria-pressed="true"] { background: #fff; color: var(--accent-strong); border-color: #fff; }
    .area-head.is-lost { background: var(--muted); }
    .skill-cell { background: var(--surface); padding: 4px 2px; height: 44px; position: relative; }
    .skill-name { display: block; line-height: 1.2; }
    .skill-cell.is-acquired .skill-name { font-weight: 700; }
    .skill-cell.is-acquired::after {
      content: '';
      position: absolute;
      inset: 2px;
      border: 2px solid var(--ink);
      border-radius: 4px;
      pointer-events: none;
    }
    .skill-cell.is-lost {
      background-image: repeating-linear-gradient(135deg, var(--lost-hatch) 0 4px, transparent 4px 8px);
    }
    .skill-cell.is-lost.is-acquired::after { border-style: dashed; border-color: var(--muted); }
    /* 目標値の色分け(朱の単色で、5=薄い → 12以上=濃い。dataviz の validate_palette.js --ordinal で検証済み) */
    .skill-value { display: block; font-size: 0.95rem; font-weight: 700; line-height: 1.1; margin-top: 2px; }
    .heat-5  { background-color: #fa9a83; }
    .heat-6  { background-color: #e58770; }
    .heat-7  { background-color: #cf745e; }
    .heat-8  { background-color: #bb614c; color: #fff; }
    .heat-9  { background-color: #a64f3a; color: #fff; }
    .heat-10 { background-color: #923d29; color: #fff; }
    .heat-11 { background-color: #7e2a17; color: #fff; }
    .heat-12 { background-color: #6a1702; color: #fff; }
    .skill-cell.heat-none .skill-value { color: var(--muted); }
    /* 濃い色のマスでは、習得特技の枠を白にする */
    .skill-cell.is-acquired:is(.heat-8, .heat-9, .heat-10, .heat-11, .heat-12)::after { border-color: #fff; }
    .heat-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 0.8rem; }
    .heat-legend-label { color: var(--muted); margin-right: 4px; }
    .heat-swatch { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 24px; padding: 0 4px; border-radius: 4px; font-weight: 700; }
    .table-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 0.75rem; color: var(--muted); }
    .legend-acquired { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--ink); border-radius: 3px; vertical-align: -3px; margin-right: 4px; }
    .legend-lost { display: inline-block; width: 14px; height: 14px; border: 1px solid var(--border); vertical-align: -3px; margin-right: 4px; background-image: repeating-linear-gradient(135deg, var(--lost-hatch) 0 4px, transparent 4px 8px); }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>シノビガミ 判定ツール</h1>
      <a href="../sinobigami/index.html">キャラシ作成サイトへ</a>
    </header>

    <section class="card" aria-labelledby="load_heading">
      <h2 id="load_heading">キャラクターを読み込む</h2>
      <div class="load-sources">
        <div class="load-source">
          <span class="load-source-label">JSONファイル</span>
          <div class="load-source-row">
            <button type="button" class="btn-outline" id="load_json_btn">ファイルを選ぶ</button>
            <input type="file" id="load_json_file" accept=".json,application/json" hidden />
          </div>
          <span class="load-note">キャラシの「データを保存 (.json)」で保存したファイル</span>
        </div>
      </div>
      <p class="load-message" id="load_message" role="status"></p>
    </section>

    <section class="card char-summary" id="char_summary" aria-live="polite"></section>

    <nav class="mode-tabs" role="tablist">
      <button type="button" class="mode-tab" role="tab" data-mode="diagnosis" id="tab_diagnosis">判定値診断</button>
      <button type="button" class="mode-tab" role="tab" data-mode="session" id="tab_session">セッション</button>
    </nav>

    <section class="card mode-panel" id="panel_diagnosis" data-mode="diagnosis" role="tabpanel">
      <h2>判定値診断</h2>
      <p class="load-note">特技表の各マスに、その特技が指定特技になったときの一番低い目標値を表示します。色が濃いほど判定が厳しい特技です。「使用不可」にした分野の習得特技は、計算に使いません。</p>
      <div class="heat-legend" aria-label="目標値の色">
        <span class="heat-legend-label">目標値</span>
        <span class="heat-swatch heat-5">5</span><span class="heat-swatch heat-6">6</span><span class="heat-swatch heat-7">7</span><span class="heat-swatch heat-8">8</span>
        <span class="heat-swatch heat-9">9</span><span class="heat-swatch heat-10">10</span><span class="heat-swatch heat-11">11</span><span class="heat-swatch heat-12">12以上</span>
      </div>
    </section>

    <section class="card mode-panel" id="panel_session" data-mode="session" role="tabpanel" hidden>
      <h2>セッション</h2>
      <p class="load-note">登録したボタンを押すと、その指定特技で判定するときの目標値を表示します。</p>
    </section>

    <section class="card" aria-labelledby="table_heading">
      <h2 id="table_heading">特技表</h2>
      <div class="skill-table-wrap">
        <table class="skill-table" id="skill_table"></table>
      </div>
      <div class="table-legend">
        <span><span class="legend-acquired"></span>習得特技</span>
        <span><span class="legend-lost"></span>使えない分野(見出しのボタンで切り替え)</span>
      </div>
    </section>
  </div>

<script>
// ==========================================
// 特技表の定義(sinobigami/index.html 準拠)
// ==========================================
const AREA_NAMES = ['器術', '体術', '忍術', '謀術', '戦術', '妖術'];

const SKILL_TABLE = [
  // row 2 ~ row 12
  ['絡繰術','騎乗術','生存術','医術','兵糧術','異形化'],
  ['火術','砲術','潜伏術','毒術','鳥獣術','召喚術'],
  ['水術','手裏剣術','遁走術','罠術','野戦術','死霊術'],
  ['針術','手練','盗聴術','調査術','地の利','結界術'],
  ['仕込み','身体操術','腹話術','詐術','意気','封術'],
  ['衣装術','歩法','隠形術','対人術','用兵術','言霊術'],
  ['縄術','走法','変装術','遊芸','記憶術','幻術'],
  ['登術','飛術','香術','九ノ一術','見敵術','瞳術'],
  ['拷問術','骨法術','分身の術','傀儡の術','暗号術','千里眼の術'],
  ['壊器術','刀術','隠蔽術','流言の術','伝達術','憑依術'],
  ['掘削術','怪力','第六感','経済力','人脈','呪術'],
];

/** skill_r{row}_c{col} → 特技名 */
const SKILL_ID_MAP = {};
SKILL_TABLE.forEach((row, ri) => {
  row.forEach((name, ci) => {
    SKILL_ID_MAP[`skill_r${ri + 2}_c${ci + 1}`] = name;
  });
});

const GAP_IDS = ['gap1', 'gap2', 'gap3', 'gap4', 'gap5', 'gap6'];

// ==========================================
// 距離と目標値の計算
// ==========================================

/**
 * 2つの分野列間の最短距離を計算(ギャップ考慮、円環)
 * col1, col2: 1〜6
 * gaps: { gap1: bool, ..., gap6: bool }
 * gap_i は col_i と col_(i%6)+1 の間にある
 *   塗りつぶし(true)  → ギャップ0マス + 移動1マス = 1マス
 *   塗りつぶしなし(false) → ギャップ1マス + 移動1マス = 2マス
 */
function calcColumnDistance(col1, col2, gaps) {
  if (col1 === col2) return 0;

  function tryPath(from, to, direction) {
    let steps = 0;
    let current = from;
    while (current !== to) {
      let next, gapIdx;
      if (direction === 1) {
        // 時計回り: current → (current%6)+1
        next = (current % 6) + 1;
        gapIdx = current;
      } else {
        // 反時計回り: current → ((current-2+6)%6)+1
        next = ((current - 2 + 6) % 6) + 1;
        gapIdx = next;
      }
      // 隣の分野への移動で1マス消費
      steps++;
      // 塗りつぶしなし → ギャップでさらに1マス追加
      if (!gaps[`gap${gapIdx}`]) steps++;
      current = next;
    }
    return steps;
  }

  return Math.min(tryPath(col1, col2, 1), tryPath(col1, col2, -1));
}

/** 2つの特技間の距離(分野間距離 + 行の差) */
function calcSkillDistance(row1, col1, row2, col2, gaps) {
  return calcColumnDistance(col1, col2, gaps) + Math.abs(row1 - row2);
}

/** skill ID から (row, col) を解析 */
function parseSkillId(id) {
  const m = id.match(/^skill_r(\d+)_c(\d+)$/);
  if (!m) return null;
  return { row: parseInt(m[1], 10), col: parseInt(m[2], 10) };
}

/** 使える習得特技(使用不可の分野を除く) */
function usableSkillIds() {
  if (!state.character) return [];
  const lost = new Set(state.lostColumns);
  return state.character.skills.filter(id => !lost.has(parseSkillId(id).col));
}

/** 習得特技 fromId で、指定特技 toId を判定するときの目標値(5 + 距離) */
function targetNumber(fromId, toId) {
  const from = parseSkillId(fromId);
  const to = parseSkillId(toId);
  return 5 + calcSkillDistance(from.row, from.col, to.row, to.col, state.character.gaps);
}

/**
 * 指定特技 toId を、使える習得特技それぞれで判定するときの目標値を、低い順に返す。
 * [{ from: 習得特技ID, target }]。使える特技が無ければ空配列。
 */
function targetsFor(toId) {
  return usableSkillIds()
    .map(from => ({ from, target: targetNumber(from, toId) }))
    .sort((a, b) => a.target - b.target);
}

/** 目標値の色の段階(5〜12。12以上はまとめる) */
const heatClass = (target) => `heat-${Math.min(Math.max(target, 5), 12)}`;

// ==========================================
// 状態(ブラウザに保存し、リロード後に復元する)
// ==========================================
const STATE_KEY = 'sinobigamiToolState';

/**
 * character: 読み込んだキャラ({ name, meta[], skills[], gaps{} }。計算に要る部分だけ)
 * lostColumns: 使えない分野の列番号(1〜6)
 * mode: 'diagnosis' | 'session'
 */
const state = { character: null, lostColumns: [], mode: 'diagnosis' };

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
    if (!saved || typeof saved !== 'object') return;
    if (saved.character && Array.isArray(saved.character.skills)) state.character = saved.character;
    if (Array.isArray(saved.lostColumns)) state.lostColumns = saved.lostColumns.filter(c => c >= 1 && c <= 6);
    if (saved.mode === 'diagnosis' || saved.mode === 'session') state.mode = saved.mode;
  } catch {}
}

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  } catch {}
}

// ==========================================
// キャラクターデータの変換
// ==========================================

/** 読み込んだデータを、ツールで使う形({ name, meta, skills, gaps })にする */
function toCharacter({ inputs = {}, checkedIds = [] }) {
  const meta = [inputs.school, inputs.sub_school, inputs.rank, inputs.belief].filter(Boolean);
  const checked = new Set(checkedIds);
  const gaps = {};
  GAP_IDS.forEach(gid => { gaps[gid] = checked.has(gid); });
  return {
    name: inputs.name || '(名前未設定)',
    meta,
    skills: checkedIds.filter(id => SKILL_ID_MAP[id]),
    gaps,
  };
}

/** キャラシの「データを保存 (.json)」(buildSaveData の形式)から変換する */
function characterFromSaveData(data) {
  if (!data || typeof data !== 'object' || !data.checkboxes) throw new Error('キャラシのデータではありません');
  const checkedIds = Object.entries(data.checkboxes).filter(([, on]) => on).map(([id]) => id);
  return toCharacter({ inputs: data.inputs || {}, checkedIds });
}

/** 読み込んだキャラを設定して、画面を描き直す */
function setCharacter(character, message) {
  state.character = character;
  saveState();
  render();
  showLoadMessage(message);
}

// ==========================================
// 描画
// ==========================================
const skillTableEl = document.getElementById('skill_table');
const charSummaryEl = document.getElementById('char_summary');
const loadMessageEl = document.getElementById('load_message');

function escapeHTML(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showLoadMessage(message, isError = false) {
  loadMessageEl.textContent = message || '';
  loadMessageEl.classList.toggle('is-error', isError);
}

function renderCharSummary() {
  const c = state.character;
  if (!c) {
    charSummaryEl.innerHTML = '<p class="char-summary-empty">キャラクターが読み込まれていません。上の方法で1人読み込んでください。</p>';
    return;
  }
  charSummaryEl.innerHTML = `
    <span class="char-summary-name">${escapeHTML(c.name)}</span>
    <span class="char-summary-meta">${c.meta.map(m => `<span>${escapeHTML(m)}</span>`).join('')}</span>
    <span class="load-note">習得特技 ${c.skills.length}個</span>`;
}

/**
 * 判定値診断: マスに一番低い目標値を表示して色を塗る。{ classes, html, title } を返す
 */
function diagnosisCell(skillId) {
  const name = SKILL_ID_MAP[skillId];
  if (!state.character) return { classes: [], html: '', title: name };
  const [best] = targetsFor(skillId);
  if (!best) return { classes: ['heat-none'], html: '<span class="skill-value">−</span>', title: `${name}: 判定に使える特技がありません` };
  return {
    classes: [heatClass(best.target)],
    html: `<span class="skill-value">${best.target}</span>`,
    title: `${name}: 目標値 ${best.target}(${SKILL_ID_MAP[best.from]}で判定)`,
  };
}

/** 特技表を描く。マスの中身は、モードごとの関数(diagnosisCell など)で足す */
function renderSkillTable() {
  const c = state.character;
  const acquired = new Set(c ? c.skills : []);
  const gaps = c ? c.gaps : {};
  const lost = new Set(state.lostColumns);

  let html = '<thead><tr><th class="num-col"></th>';
  AREA_NAMES.forEach((area, ai) => {
    const col = ai + 1;
    const isLost = lost.has(col);
    html += `<th class="area-head${isLost ? ' is-lost' : ''}" scope="col">
        <span class="area-head-name">${area}</span>
        <button type="button" class="lost-toggle" data-col="${col}" aria-pressed="${isLost}"
          title="生命力を失ってこの分野の特技が使えないときに押す">${isLost ? '使用不可' : '使用可'}</button>
      </th>`;
    if (ai < 5) html += `<th class="gap-col${gaps[`gap${col}`] ? ' gap-on' : ''}"></th>`;
  });
  html += '</tr></thead><tbody>';

  SKILL_TABLE.forEach((row, ri) => {
    const rowNum = ri + 2;
    html += `<tr><th class="num-col" scope="row">${rowNum}</th>`;
    row.forEach((skillName, ci) => {
      const col = ci + 1;
      const skillId = `skill_r${rowNum}_c${col}`;
      const extra = state.mode === 'diagnosis' ? diagnosisCell(skillId) : { classes: [], html: '', title: skillName };
      const classes = ['skill-cell', ...extra.classes];
      if (acquired.has(skillId)) classes.push('is-acquired');
      if (lost.has(col)) classes.push('is-lost');
      html += `<td class="${classes.join(' ')}" data-skill-id="${skillId}" title="${escapeHTML(extra.title)}"><span class="skill-name">${skillName}</span>${extra.html}</td>`;
      if (ci < 5) html += `<td class="gap-col${gaps[`gap${col}`] ? ' gap-on' : ''}"></td>`;
    });
    html += '</tr>';
  });
  html += '</tbody>';
  skillTableEl.innerHTML = html;
}

function renderMode() {
  document.querySelectorAll('.mode-tab').forEach(tab => {
    const active = tab.dataset.mode === state.mode;
    tab.classList.toggle('is-active', active);
    tab.setAttribute('aria-selected', String(active));
  });
  document.querySelectorAll('.mode-panel').forEach(panel => {
    panel.hidden = panel.dataset.mode !== state.mode;
  });
}

function render() {
  renderCharSummary();
  renderMode();
  renderSkillTable();
}

// ==========================================
// イベント
// ==========================================
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.mode = tab.dataset.mode;
    saveState();
    render();
  });
});

// 分野の「使用可/使用不可」を切り替える(両モード共通)
skillTableEl.addEventListener('click', (e) => {
  const toggle = e.target.closest('.lost-toggle');
  if (!toggle) return;
  const col = Number(toggle.dataset.col);
  state.lostColumns = state.lostColumns.includes(col)
    ? state.lostColumns.filter(c => c !== col)
    : [...state.lostColumns, col].sort();
  saveState();
  render();
});

// JSONファイル
const loadJsonBtn = document.getElementById('load_json_btn');
const loadJsonFile = document.getElementById('load_json_file');
loadJsonBtn.addEventListener('click', () => loadJsonFile.click());
loadJsonFile.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = ''; // 同じファイルをもう一度選べるようにする
  if (!file) return;
  try {
    const character = characterFromSaveData(JSON.parse(await file.text()));
    setCharacter(character, `「${character.name}」を読み込みました(${file.name})。`);
  } catch (err) {
    console.error(err);
    showLoadMessage(`「${file.name}」を読み込めませんでした。キャラシで保存したJSONファイルか確認してください。`, true);
  }
});

loadState();
render();
</script>
</body>
</html>
